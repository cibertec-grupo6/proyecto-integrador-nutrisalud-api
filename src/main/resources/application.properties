spring.application.name=nutrisalud-api
# Configuracion del Servidor
server.port=8080



# Configuracion de MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/nutrisalud_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Configuracion de Logging (para ver errores)
logging.level.org.springframework.security=DEBUG
logging.level.com.nutrisalud=DEBUG

# ===============================
# Configuracion de JWT
# ===============================
# Clave secreta en Base64 (debe tener al menos 32 bytes / 256 bits para HS256)
app.jwt.secret=c2VjcmV0b2RlbnV0cmlzYWx1ZDIwMjZwYXJhcHJveWVjdG9pbnRlZ3JhZG9yY2liZXJ0ZWM=
# Tiempo de expiracion del token en milisegundos (86400000 ms = 24 horas)
app.jwt.expiration-ms=86400000